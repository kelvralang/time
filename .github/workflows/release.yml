name: Release native artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: kelvralang/package-actions/.github/workflows/native-release.yml@v2
    with:
      package_name: time
      runtime_ref: main
      targets: '["linux-x86_64-gnu","linux-arm64-gnu","macos-arm64"]'
      artifact_path: package.so
